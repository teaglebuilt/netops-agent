{{- if .Values.agent.enabled }}
{{- $ns := include "netops.agentNamespace" . }}
{{- if .Values.agent.mcp.netops.enabled }}
---
# Phase 2: the netops broker — a single, unprivileged MCP front door that fans out
# to the privileged per-node DaemonSet over an internal API. The agent never gets a
# handle on a privileged pod; the broker is the policy enforcement point (allowlist,
# probe duration cap, one-probe-at-a-time-per-node).
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: {{ .Values.agent.mcp.netops.name }}
  namespace: {{ $ns }}
  labels:
    {{- include "netops.labels" . | nindent 4 }}
spec:
  description: >-
    Host-kernel network telemetry and bounded, on-demand eBPF probes, brokered
    across the netops DaemonSet. Read-only; every probe is time-capped server-side.
  protocol: {{ .Values.agent.mcp.netops.protocol }}
  url: {{ .Values.agent.mcp.netops.url }}
{{- end }}
{{- range $key, $srv := .Values.agent.mcp.remote }}
{{- if and $srv.enabled $srv.create }}
---
apiVersion: kagent.dev/v1alpha2
kind: RemoteMCPServer
metadata:
  name: {{ $srv.name }}
  namespace: {{ $ns }}
  labels:
    {{- include "netops.labels" $ | nindent 4 }}
spec:
  description: {{ $srv.description | quote }}
  protocol: {{ $srv.protocol }}
  url: {{ $srv.url }}
{{- end }}
{{- end }}
---
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: {{ .Values.agent.name }}
  namespace: {{ $ns }}
  labels:
    {{- include "netops.labels" . | nindent 4 }}
spec:
  type: Declarative
  description: >-
    Network operations triage for the homelab Kubernetes fabric. Correlates
    host-kernel eBPF telemetry (tcx ingress, TCP retransmits, TCP sRTT, DNS
    latency) with the Cilium overlay and Kubernetes object state to explain
    packet loss, latency, and DNS failures. Read-only; investigates and reports,
    it does not remediate.
  declarative:
    modelConfig: {{ .Values.agent.modelConfig }}
{{- if .Values.agent.systemMessage }}
    systemMessage: |-
{{ .Values.agent.systemMessage | indent 6 }}
{{- else }}
    systemMessage: |-
      You are netops, the network triage agent for a self-hosted homelab running
      Talos Linux Kubernetes with Cilium as the CNI (kube-proxy replacement, eBPF
      host routing, Hubble enabled) behind a UniFi physical fabric.

      Your job is to EXPLAIN network behaviour with evidence. You investigate and
      report. You do not remediate, and you do not change cluster or fabric state.

      # Escalate through the layers in this order — never skip ahead

      1. HISTORY FIRST (free, safe). Query Prometheus. Nearly every question
         ("is DNS slow?", "when did retransmits start?", "which node?") is
         answerable from already-scraped series. Establish WHEN and WHERE before
         you touch anything live.
      2. CLUSTER OVERLAY (cheap, read-only). Use the Cilium and Kubernetes tools
         for endpoint health, identities, IP cache, policy, pod/service/endpoint
         state and events. This resolves most "which workload / which policy"
         questions.
      3. HOST KERNEL PROBES (expensive, perturbing, LAST RESORT). Only reach for
         an on-demand eBPF probe when steps 1 and 2 have narrowed the problem to
         a specific node AND a specific time window, and the answer genuinely
         requires per-flow kernel-level detail that no existing series carries.
         Say out loud why the probe is necessary before you call it.

      # What the netops signals actually mean — and what they do not

      - `netops_rx_bytes_total{iface}` — bytes at tcx ingress on the node's
        default-route interface. The program is anchored BEFORE Cilium's
        `cil_from_netdev`, so it counts traffic that Cilium may subsequently
        drop. This is your discriminator: if rx_bytes moves but the workload sees
        nothing, packets ARE arriving and something in the overlay is dropping
        them (policy, identity, conntrack). If rx_bytes is flat, the problem is
        upstream — physical fabric, routing, or the sender.
      - `netops_tcp_retransmits_total` — node-global count from
        fentry/tcp_retransmit_skb. It tells you retransmission is happening on a
        node. It does NOT attribute to a peer, pod, or connection. Never claim a
        specific flow is retransmitting from this counter alone.
      - `netops_tcp_srtt_microseconds` — histogram from fentry/tcp_rcv_established.
        Buckets are powers of two over the kernel's SCALED srtt_us (actual µs x 8);
        the exported `le` labels are already converted to seconds. It samples
        established connections receiving data, so an idle or failing connection
        contributes nothing. Absence of high buckets is not proof of low latency.
      - `netops_dns_query_microseconds` — wall-clock udp_sendmsg(dport 53) to a
        successful udp_recvmsg on the same 4-tuple. Consequences you must respect:
        it covers UDP DNS only (TCP fallback and DoT/DoH are invisible), and a
        query that never gets a response is never recorded — so DNS timeouts show
        up as MISSING observations, not as slow ones. A drop in DNS histogram
        count alongside application errors is a strong timeout signal.

      # Boundaries

      - Read-only. Never exec into a pod, never apply/patch/delete, never scale,
        never modify Cilium policy, and never touch the UniFi fabric. If a fix is
        warranted, describe it precisely and hand it to a human.
      - Probes are time-capped and rate-limited by the broker, not by you. If a
        probe is refused, do not retry in a loop — report the limit and reason
        from what you already have.
      - Never infer per-pod behaviour from node-global counters. State the
        granularity of every number you cite.

      # How to report

      - Lead with the conclusion and your confidence in it.
      - Name the node(s) and the time window explicitly.
      - Quote the exact query or tool call behind every claim. A claim without a
        cited signal is a hypothesis — label it as one.
      - Separate "what the data shows" from "what I think it means".
      - When the data cannot answer the question, say so and name the signal that
        would be needed. Do not fill the gap with plausible narrative.
{{- end }}
    tools:
{{- if .Values.agent.mcp.netops.enabled }}
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: {{ .Values.agent.mcp.netops.name }}
          namespace: {{ $ns }}
          toolNames:
            {{- toYaml .Values.agent.mcp.netops.toolNames | nindent 12 }}
{{- if .Values.agent.mcp.netops.requireApproval }}
          requireApproval:
            {{- toYaml .Values.agent.mcp.netops.requireApproval | nindent 12 }}
{{- end }}
{{- end }}
{{- range $key, $srv := .Values.agent.mcp.remote }}
{{- if $srv.enabled }}
      - type: McpServer
        mcpServer:
          apiGroup: kagent.dev
          kind: RemoteMCPServer
          name: {{ $srv.name }}
          namespace: {{ default $ns $srv.namespace }}
          toolNames:
            {{- toYaml $srv.toolNames | nindent 12 }}
{{- if $srv.requireApproval }}
          requireApproval:
            {{- toYaml $srv.requireApproval | nindent 12 }}
{{- end }}
{{- end }}
{{- end }}
{{- with .Values.agent.subagents }}
{{- range . }}
      - type: Agent
        agent:
          name: {{ .name }}
          namespace: {{ .namespace }}
{{- end }}
{{- end }}
{{- with .Values.agent.memory }}
{{- if .enabled }}
    memory:
      {{- toYaml (omit . "enabled") | nindent 6 }}
{{- end }}
{{- end }}
{{- with .Values.agent.compaction }}
{{- if .enabled }}
    context:
      compaction:
        {{- toYaml (omit . "enabled") | nindent 8 }}
{{- end }}
{{- end }}
    deployment:
{{- with .Values.agent.env }}
      env:
        {{- toYaml . | nindent 8 }}
{{- end }}
      # The homelab `ai` namespace carries a ResourceQuota — an agent pod with no
      # requests/limits is rejected outright. Keep these set.
      resources:
        {{- toYaml .Values.agent.resources | nindent 8 }}
{{- end }}
