---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "netops.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "netops.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "netops.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "netops.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.metrics.scrapeAnnotations .Values.podAnnotations }}
      annotations:
        {{- if .Values.metrics.scrapeAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.port | quote }}
        prometheus.io/path: "/metrics"
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "netops.serviceAccountName" . }}
      hostNetwork: true
      hostPID: false
      dnsPolicy: ClusterFirstWithHostNet
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent
          image: {{ include "netops.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: NETOPS_SYSFS
              value: {{ .Values.pcie.sysfsRoot | default "/host/sys" | quote }}
            - name: NETOPS_ROLE
              value: {{ .Values.pcie.role | default "guest" | quote }}
            {{- with .Values.iface }}
            - name: NETOPS_DEVICE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              {{- if gt (int .Values.metrics.hostPort) 0 }}
              hostPort: {{ .Values.metrics.hostPort }}
              {{- end }}
              protocol: TCP
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            runAsUser: 0
            runAsNonRoot: false
            {{- if .Values.seccompProfile }}
            seccompProfile:
              {{- toYaml .Values.seccompProfile | nindent 14 }}
            {{- end }}
            capabilities:
              add:
                {{- range .Values.capabilities }}
                - {{ . }}
                {{- end }}
              drop:
                - ALL
          volumeMounts:
            - name: bpffs
              mountPath: /sys/fs/bpf
              mountPropagation: HostToContainer
            - name: btf
              mountPath: /sys/kernel/btf
              readOnly: true
            - name: host-sys
              mountPath: {{ .Values.pcie.sysfsRoot | default "/host/sys" | quote }}
              readOnly: true
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.livenessProbe.enabled }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.metrics.port }}
              host: 127.0.0.1
            {{- toYaml (omit .Values.livenessProbe "enabled") | nindent 12 }}
          {{- end }}
          {{- if .Values.readinessProbe.enabled }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.metrics.port }}
              host: 127.0.0.1
            {{- toYaml (omit .Values.readinessProbe "enabled") | nindent 12 }}
          {{- end }}
      volumes:
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
            type: Directory
        - name: btf
          hostPath:
            path: /sys/kernel/btf
            type: Directory
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
